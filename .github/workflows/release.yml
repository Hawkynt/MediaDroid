name: Release

# Stable release — MANUAL dispatch only. Runs CI, builds the APKs and the AAB, publishes, then
# cuts a dated GitHub Release. Versions never come from a git tag; the repo-level marker is the
# date, so the Release/tag is `vYYYYMMDD` — the same date Gradle stamps into versionName.
# Nightlies happen automatically (nightly.yml).
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you cutting this release? (optional, for the audit log)'
        required: false

permissions:
  contents: write
  pull-requests: write                         # the changelog goes to main as a pull request
  actions: write                               # ...whose gate this workflow dispatches

# Force JavaScript-based actions to run on Node 24 instead of the deprecated Node 20 ahead of
# the 2026-06-16 hard cutover, until we bump each action to a Node-24-native major version.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    uses: ./.github/workflows/_build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute release marker
        run: echo "REL=v$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: app-artifacts
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update changelog + generate release notes (bucketed by + - * # !)
        uses: Hawkynt/RepositoryTemplate/release-notes@v1
        with:
          mode: release
          marker: ${{ env.REL }}
          notes: RELEASE_NOTES.md

      - name: Create GitHub Release (dated marker; tags vYYYYMMDD at the commit that was built)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REL }}
          name: ${{ env.REL }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body_path: RELEASE_NOTES.md            # commit-message changelog, not GitHub's PR notes

      # main takes changes through signed pull requests only, so the changelog cannot be pushed
      # there. It is committed through the contents API instead, which GitHub signs, onto a branch
      # of its own, and offered as a pull request. A pull request opened with the workflow token
      # starts no workflow, so the gate is dispatched on that branch explicitly. The generator
      # filters its own "* update changelog for vYYYYMMDD" commit, so it never shows up in a later
      # release's notes even though it lands after the tag.
      - name: Offer the changelog as a pull request (if it changed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- CHANGELOG.md)" ]; then
            echo "::notice::CHANGELOG.md is unchanged."
            exit 0
          fi
          branch="changelog/$REL"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$branch" -f sha="$GITHUB_SHA" >/dev/null
          args=(-X PUT "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md"
                -f message="* update changelog for $REL" -f branch="$branch" -F content=@-)
          blob=$(gh api "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md?ref=$branch" --jq '.sha' 2>/dev/null || true)
          if [ -n "$blob" ]; then
            args+=(-f sha="$blob")
          fi
          base64 -w0 CHANGELOG.md | gh api "${args[@]}" --jq '"committed \(.commit.sha[0:8]), verified=\(.commit.verification.verified)"'
          gh pr create --base main --head "$branch" --title "* update changelog for $REL" \
            --body "Changelog for the $REL release, generated from the commit subjects since the previous release."
          gh workflow run ci.yml --ref "$branch"
