name: Desktop packages

# The desktop apps (README "Platform support"), built and tested on the system each is for, then packed:
# Linux — the AppImage; Windows — the MSI and the portable zip. Called by ci.yml (the pull-request gate: the packages
# must still come together), nightly.yml and release.yml (which publish what this uploads). Published packages carry
# the LGPL FFmpeg only; the GPL build (-PfullFfmpeg) is for one's own machine and never built here. Versions come from
# the build date, as the Android app's (desktop/build.gradle.kts).
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref/SHA to build (defaults to caller ref)
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # The GL stage tests run on Mesa's software OpenGL (llvmpipe) and must not skip themselves there.
  MEDIADROID_GL: required

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04: the native library built here runs on glibc 2.35 and newer — ncnn's own release's floor.
          - system: linux
            runner: ubuntu-22.04
            tasks: ":desktop:appImage"
          - system: windows
            runner: windows-latest
            tasks: ":desktop:packageMsi :desktop:windowsZip"
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
      # The Android modules are configured with the rest even when only the desktop is built.
      - uses: android-actions/setup-android@v4

      # Mesa for the GL stage tests, headless: on Linux an X server in memory over llvmpipe; on Windows Mesa's
      # opengl32.dll (pal1000/mesa-dist-win, MIT; a tagged release checked against its digest) beside the java.exe
      # the tests run on, where Windows looks first — removed again before packing, so no package carries it.
      - name: Mesa and a virtual display (Linux)
        if: matrix.system == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
      # Fontconfig's headers, so libass in the native library asks Linux for its fonts (native/ass).
      - name: Fontconfig (Linux)
        if: matrix.system == 'linux'
        run: sudo apt-get install -y -qq libfontconfig-dev
      - name: Mesa's OpenGL (Windows)
        if: matrix.system == 'windows'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/mesa.7z" \
            https://github.com/pal1000/mesa-dist-win/releases/download/26.2.3/mesa3d-26.2.3-release-msvc.7z
          echo "3f3613adb43cfd0f2e665ce2400b130c275f0b3317cb3a05566320a3a67589ed  $RUNNER_TEMP/mesa.7z" | sha256sum -c -
          7z e -y "$RUNNER_TEMP/mesa.7z" -o"$(cygpath -w "$JAVA_HOME/bin")" x64/opengl32.dll x64/libgallium_wgl.dll
          echo "GALLIUM_DRIVER=llvmpipe" >> "$GITHUB_ENV"

      # The desktop tests on the system they are for: FFmpeg's and LWJGL's natives, the sound path, the store, the
      # GL stage — and the native tree (native/) built for it with the system's compiler and loaded (-PnativeLibrary).
      - name: Desktop tests
        run: |
          if [ "${{ matrix.system }}" = linux ]; then
            xvfb-run -a -s "-screen 0 1280x1024x24" ./gradlew :engine:desktop:test :desktop:test -PnativeLibrary --no-daemon
          else
            ./gradlew :engine:desktop:test :desktop:test -PnativeLibrary --no-daemon
          fi
      # How the stage's picture reaches the window (#287): every candidate at 1080p and 4K, on llvmpipe — a check that
      # each still runs and a record to compare against, never the decision (that is measured on real graphics,
      # README "Platform support"). The table goes into the run's summary.
      - name: Presentation benchmark (Linux, llvmpipe)
        if: matrix.system == 'linux'
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew :desktop:presentationBench -Pframes=120 --no-daemon
          cat desktop/build/reports/presentation.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the test reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.system }}-test-reports
          path: |
            engine/desktop/build/reports/tests/
            desktop/build/reports/tests/
          if-no-files-found: ignore
      - name: Keep the native library
        uses: actions/upload-artifact@v4
        with:
          name: libmediadroid-${{ matrix.system }}-x64
          path: native/build/desktop/lib/*
          if-no-files-found: error
      - name: Take Mesa away again (Windows)
        if: matrix.system == 'windows'
        run: |
          bin="$(cygpath -u "$JAVA_HOME")/bin"
          rm -f "$bin/opengl32.dll" "$bin/libgallium_wgl.dll"

      - name: Packages
        run: ./gradlew ${{ matrix.tasks }} --no-daemon
      - name: Stage the packages under their published names
        run: |
          mkdir -p dist
          if [ "${{ matrix.system }}" = linux ]; then
            cp desktop/build/dist/MediaDroid-linux-x64.AppImage dist/
          else
            cp desktop/build/compose/binaries/main/msi/*.msi dist/MediaDroid-windows-x64.msi
            cp desktop/build/dist/MediaDroid-windows-x64.zip dist/
          fi
          ls -la dist

      # Each package as a user gets it: unpacked, its licence and notices on top, and started once — the window drawn
      # and its picture written (MEDIADROID_SNAPSHOT) within the minute.
      - name: Check the AppImage
        if: matrix.system == 'linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          check="$RUNNER_TEMP/appimage"
          mkdir -p "$check/data" && cd "$check"
          "$GITHUB_WORKSPACE/dist/MediaDroid-linux-x64.AppImage" --appimage-extract > /dev/null
          for f in LICENSE THIRD-PARTY-NOTICE.desktop.txt THIRD-PARTY-NOTICE.ffmpeg.txt THIRD-PARTY-NOTICE.libass.txt \
            THIRD-PARTY-NOTICE.libgomp.txt; do
            test -s "squashfs-root/usr/$f" || { echo "the AppImage lacks $f"; exit 1; }
          done
          # The native library beside the jars with the OpenMP runtime it needs, and the runtime's java launcher the
          # neural self-test starts its processes with.
          app=squashfs-root/usr/lib/app
          for f in "$app/libmediadroid.so" "$app/libgomp.so.1" squashfs-root/usr/lib/runtime/bin/java; do
            test -s "$f" || { echo "the AppImage lacks $f"; exit 1; }
          done
          squashfs-root/usr/lib/runtime/bin/java -version
          # Everything the library needs is either the system's own (the C library, Fontconfig) or carried beside it.
          for needed in $(readelf -d "$app/libmediadroid.so" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p'); do
            case "$needed" in
              libc.so.6|libm.so.6|libmvec.so.1|libpthread.so.0|libdl.so.2|librt.so.1|ld-linux-x86-64.so.2|libfontconfig.so.1) ;;
              *) test -s "$app/$needed" || { echo "the AppImage lacks $needed, which libmediadroid.so needs"; exit 1; } ;;
            esac
          done
          # The oldest glibc it runs on: Ubuntu 22.04's, 2.35, as ncnn's release.
          newest=$(objdump -T "$app/libmediadroid.so" "$app/libgomp.so.1" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "needs $newest"
          test "$(printf '%s\nGLIBC_2.35\n' "$newest" | sort -V | tail -1)" = GLIBC_2.35 \
            || { echo "the native library needs $newest, newer than glibc 2.35"; exit 1; }
          # Loaded by the packaged runtime as the app loads it, its OpenMP runtime the carried one.
          LD_DEBUG=libs squashfs-root/usr/lib/runtime/bin/java -cp "$app/*" \
            com.hawkynt.mediadroid.engine.desktop.NativeNetworks 2> ld.txt
          grep -q "calling init: .*/lib/app/libgomp.so.1" ld.txt \
            || { echo "libmediadroid.so ran on another libgomp than the carried one"; exit 1; }
          XDG_DATA_HOME="$check/data" MEDIADROID_SNAPSHOT="$check/start.png" xvfb-run -a -s "-screen 0 1920x1080x24" \
            timeout -k 5 60 "$GITHUB_WORKSPACE/dist/MediaDroid-linux-x64.AppImage" || true
          pkill -f '/usr/bin/MediaDroid' || true
          test -s start.png || { echo "the AppImage did not draw its window"; exit 1; }
      - name: Check the MSI and the zip
        if: matrix.system == 'windows'
        shell: pwsh
        run: |
          $check = Join-Path $env:RUNNER_TEMP 'windows'
          $msi = (Resolve-Path dist/MediaDroid-windows-x64.msi).Path
          $installed = Join-Path $check 'msi'
          $p = Start-Process msiexec -ArgumentList "/a `"$msi`" /qn TARGETDIR=`"$installed`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /a failed: $($p.ExitCode)" }
          Expand-Archive dist/MediaDroid-windows-x64.zip -DestinationPath (Join-Path $check 'zip')
          $notices = @('LICENSE', 'THIRD-PARTY-NOTICE.desktop.txt', 'THIRD-PARTY-NOTICE.ffmpeg.txt',
            'THIRD-PARTY-NOTICE.libass.txt', 'THIRD-PARTY-NOTICE.vcomp140.txt')
          # Windows' own libraries, there on every Windows 10/11; whatever else the native library needs has to come
          # with the package — beside it, or in the runtime's bin folder (the C++ runtime the JVM brings).
          $system = '^(kernel32|user32|gdi32|advapi32|shell32|ole32|oleaut32|dwrite|ws2_32|bcrypt|api-ms-win-.*)\.dll$'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -Last 1
          foreach ($root in @($installed, (Join-Path $check 'zip'))) {
            foreach ($f in $notices) {
              if (-not (Get-ChildItem -Recurse -File -Path $root -Filter $f)) { throw "$root lacks $f" }
            }
            # The native library beside the jars with Visual C++'s OpenMP runtime, and the runtime's java launcher
            # the neural self-test starts its processes with.
            $dll = Get-ChildItem -Recurse -File -Path $root -Filter mediadroid.dll | Select-Object -First 1
            if (-not $dll) { throw "$root lacks mediadroid.dll" }
            if (-not (Test-Path (Join-Path $dll.DirectoryName 'vcomp140.dll'))) { throw "$root lacks vcomp140.dll" }
            $java = Get-ChildItem -Recurse -File -Path $root -Filter java.exe | Select-Object -First 1
            if (-not $java) { throw "$root lacks the runtime's java.exe" }
            & $java.FullName -version
            if ($LASTEXITCODE -ne 0) { throw "$($java.FullName) does not start" }
            $needed = & $dumpbin /nologo /dependents $dll.FullName | ForEach-Object { $_.Trim() } |
              Where-Object { $_ -match '^[\w.-]+\.dll$' }
            Write-Output "mediadroid.dll needs: $($needed -join ', ')"
            foreach ($n in $needed) {
              if ($n -match $system) { continue }
              $carried = (Test-Path (Join-Path $dll.DirectoryName $n)) -or (Test-Path (Join-Path $java.DirectoryName $n))
              if (-not $carried) { throw "$root lacks $n, which mediadroid.dll needs" }
            }
            # Loaded by the packaged runtime as the app loads it.
            & $java.FullName -cp (Join-Path $dll.DirectoryName '*') com.hawkynt.mediadroid.engine.desktop.NativeNetworks
            if ($LASTEXITCODE -ne 0) { throw "the native library does not load from $root" }
          }
          $png = Join-Path $check 'start.png'
          $env:MEDIADROID_SNAPSHOT = $png
          $app = Start-Process (Join-Path $check 'zip/MediaDroid/MediaDroid.exe') -PassThru
          for ($i = 0; $i -lt 60 -and -not (Test-Path $png); $i++) { Start-Sleep -Seconds 1 }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path $png)) { throw 'the portable app did not draw its window' }

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.system }}-artifacts
          path: dist/*
          if-no-files-found: error

  # The native tree on Linux arm64, which ncnn publishes no release for: ncnn built from its full source, the library
  # built against it, loaded by the JVM and a network run (the desktop packages are x64 only for now).
  native-linux-arm64:
    name: native linux-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
      # The Android modules are configured with the rest even when only the desktop is built.
      - uses: android-actions/setup-android@v4
      - name: Fontconfig (libass's fonts on Linux)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libfontconfig-dev
      - name: Native library and its test
        run: ./gradlew :engine:desktop:test -PnativeLibrary --tests '*NativeNetworksTest' --tests '*LibAssTest' --no-daemon
      - name: Keep the test reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-arm64-test-reports
          path: engine/desktop/build/reports/tests/
          if-no-files-found: ignore
      - name: Keep the native library
        uses: actions/upload-artifact@v4
        with:
          name: libmediadroid-linux-arm64
          path: native/build/desktop/lib/*
          if-no-files-found: error
