name: Build artifacts

# Shared build block. Called by release.yml (manual dispatch) and nightly.yml (auto, on merge
# to main). Single place that turns a commit into shippable artifacts so release and nightly
# never diverge. Versions are stamped by Gradle from the build date (see app/build.gradle.kts),
# matching the repo's vYYYYMMDD markers — no git tag feeds the version.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref/SHA to build (defaults to caller ref)
        type: string
        required: false
        default: ""

permissions:
  contents: read

# Force JavaScript-based actions to run on Node 24 instead of the deprecated Node 20 ahead of
# the 2026-06-16 hard cutover, until we bump each action to a Node-24-native major version.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Assemble debug APK, release APK, release AAB
        run: ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon
      # Android refuses to install an APK without a signature ("package appears to be invalid"),
      # so nothing unsigned is ever published. The release key is a PKCS12 keystore held in the
      # repo secrets; a run without them fails here rather than shipping something uninstallable.
      - name: Sign release APK and AAB with the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret missing; refusing to publish an unsigned release"
            exit 1
          fi
          mkdir -p dist
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --v4-signing-enabled false \
            --out dist/MediaDroid.apk app/build/outputs/apk/release/app-release-unsigned.apk
          "$apksigner" verify --verbose dist/MediaDroid.apk
          jarsigner -keystore "$RUNNER_TEMP/release.p12" -storetype PKCS12 \
            -storepass:env KEYSTORE_PASSWORD -keypass:env KEYSTORE_PASSWORD \
            -signedjar dist/MediaDroid.aab app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          rm "$RUNNER_TEMP/release.p12"
      - name: Stage debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk dist/MediaDroid-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: app-artifacts
          path: dist/*
          if-no-files-found: error
